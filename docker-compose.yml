version: "3.9"
# frontend/ = Next.js officer dashboard
# backend/  = all FastAPI microservices (shared venv, one codebase)

services:
  # ── Databases & Storage ──────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg15
    container_name: borderguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-borderguard}
      POSTGRES_USER: ${POSTGRES_USER:-borderguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-borderguard}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: borderguard-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend Microservices (all built from the shared backend/ image) ──────────
  # Each service runs a different uvicorn module from the same codebase.
  ocr-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: borderguard-ocr
    restart: unless-stopped
    env_file: .env
    command: ["uvicorn", "ocr_service.main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app   # hot-reload in dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  validation-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: borderguard-validation
    restart: unless-stopped
    env_file: .env
    command: ["uvicorn", "validation_service.main:app", "--host", "0.0.0.0", "--port", "8002"]
    ports:
      - "8002:8002"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  tampering-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: borderguard-tampering
    restart: unless-stopped
    env_file: .env
    command: ["uvicorn", "tampering_service.main:app", "--host", "0.0.0.0", "--port", "8003"]
    ports:
      - "8003:8003"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  face-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: borderguard-face
    restart: unless-stopped
    env_file: .env
    command: ["uvicorn", "face_service.main:app", "--host", "0.0.0.0", "--port", "8004"]
    ports:
      - "8004:8004"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  risk-engine:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: borderguard-risk
    restart: unless-stopped
    env_file: .env
    command: ["uvicorn", "risk_engine.main:app", "--host", "0.0.0.0", "--port", "8005"]
    ports:
      - "8005:8005"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  audit-ledger:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: borderguard-audit
    restart: unless-stopped
    env_file: .env
    command: ["uvicorn", "audit_ledger.main:app", "--host", "0.0.0.0", "--port", "8006"]
    ports:
      - "8006:8006"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  cross-checkpoint-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: borderguard-cross-checkpoint
    restart: unless-stopped
    env_file: .env
    command: ["uvicorn", "cross_checkpoint_service.main:app", "--host", "0.0.0.0", "--port", "8008"]
    ports:
      - "8008:8008"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  orchestrator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: borderguard-orchestrator
    restart: unless-stopped
    env_file: .env
    command: ["uvicorn", "orchestrator.main:app", "--host", "0.0.0.0", "--port", "8007"]
    ports:
      - "8007:8007"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      ocr-service:
        condition: service_healthy
      validation-service:
        condition: service_healthy
      tampering-service:
        condition: service_healthy
      face-service:
        condition: service_healthy
      risk-engine:
        condition: service_healthy
      audit-ledger:
        condition: service_healthy
      cross-checkpoint-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Frontend (Next.js officer dashboard) ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: borderguard-frontend
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8007}
    ports:
      - "3000:3000"
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 20s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
  minio-data:
