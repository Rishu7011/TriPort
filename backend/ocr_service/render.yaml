services:
  - type: web
    name: triport-ocr-service
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_API_KEY
        sync: false
