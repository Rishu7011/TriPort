# Myanmar — Country-Specific Document Format Rules
#
# Context: Myanmar nationals cross at land-border checkpoints like
# Moreh/Tamu (Manipur) and Zokhawthar (Mizoram). Myanmar documents
# include both the standard passport and the NRC (National Registration Card).
#
# Sources:
#   - Myanmar Passport: 2 uppercase letters followed by 6 digits.
#     e.g. "PA123456", "MA654321". Modern passports have 'MA' prefix.
#   - Myanmar NRC (National Registration Card):
#     Format: <Township-code>/<Script-code>(N|E|P|T|F)<6-digit serial>
#     e.g. "12/MAGANA(N)012345" — complex, variable-length.
#     Simplified regex: digit(s) / uppercase letters (N|E|P|T|F) digits
#   - Myanmar Foreign Registration Certificate (FRC) also common —
#     treated as National ID here.

- rule_name: mm_passport_number_format
  description: "Myanmar passport number must be 2 uppercase letters followed by 6 digits."
  rule_type: regex_format
  field: passport_number
  pattern: "^[A-Z]{2}\\d{6}$"
  error_message: "Myanmar passport number does not match expected format (MA123456)."

- rule_name: mm_nrc_format
  description: >
    Myanmar NRC (National Registration Card) format:
    Township-code / Script-abbreviation (registration-type) 6-digit serial.
    e.g. '12/MAGANA(N)012345' or simplified '9/LA(N)123456'.
  rule_type: regex_format
  field: id_number
  pattern: "^\\d{1,2}/[A-Z]{2,10}\\((N|E|P|T|F|R)\\)\\d{6}$"
  error_message: "Myanmar NRC format is invalid. Expected format: D/ABCDE(N)123456."

- rule_name: mm_dob_in_past
  description: "Date of birth must be in the past."
  rule_type: date_check
  field: date_of_birth
  condition: "< today"
  error_message: "Date of birth is invalid or in the future."

- rule_name: mm_doc_expiry_valid
  description: "Myanmar document expiry must be in the future."
  rule_type: date_check
  field: date_of_expiry
  condition: "> today"
  error_message: "Myanmar travel document has expired."
