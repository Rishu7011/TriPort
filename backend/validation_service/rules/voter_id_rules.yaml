# Indian Voter ID / EPIC Validation Rules

- rule_name: voter_id_number_format
  description: "EPIC number must contain three letters followed by seven digits."
  rule_type: regex_format
  field: voter_id_number
  pattern: "^[A-Z]{3}[-/]?[0-9]{7}$"
  error_message: "Voter ID / EPIC number does not conform to the expected format."

- rule_name: voter_dob_in_past
  description: "Elector date of birth must be in the past."
  rule_type: date_check
  field: date_of_birth
  condition: "< today"
  error_message: "Voter ID date of birth cannot be in the future."
