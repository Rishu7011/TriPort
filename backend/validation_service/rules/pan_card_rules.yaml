# Indian PAN Card Validation Rules

- rule_name: pan_number_format
  description: "PAN must contain five letters, four digits, and one final letter."
  rule_type: regex_format
  field: pan_number
  pattern: "^[A-Z]{5}[0-9]{4}[A-Z]$"
  error_message: "PAN number does not conform to the expected format (e.g. ABCDE1234F)."

- rule_name: pan_dob_in_past
  description: "Card holder date of birth must be in the past."
  rule_type: date_check
  field: date_of_birth
  condition: "< today"
  error_message: "PAN card date of birth cannot be in the future."
