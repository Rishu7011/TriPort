# Land-Border Permit Validation Rules
#
# Rule Types:
#   date_check    — validates date field relative to today
#   regex_format  — validates field string against a pattern
#
# Context: Land-border permits are non-standard, non-MRZ documents issued by
# regional authorities for cross-border travel. Formats vary significantly
# but share a core set of required fields.

- rule_name: permit_number_format
  description: "Permit number must be alphanumeric (5–20 chars), allowing hyphens and slashes."
  rule_type: regex_format
  field: permit_number
  pattern: "^[A-Z0-9/\\-]{5,20}$"
  error_message: "Permit number does not conform to expected format."

- rule_name: permit_valid_until_not_passed
  description: "Permit valid-until date must be in the future."
  rule_type: date_check
  field: valid_until
  condition: "> today"
  error_message: "Land-border permit has expired."

- rule_name: permit_name_present
  description: "Permit holder name must be present and non-empty."
  rule_type: regex_format
  field: name
  pattern: "^[A-Za-z .'-]{2,100}$"
  error_message: "Permit holder name is missing or contains invalid characters."

- rule_name: permit_type_present
  description: "Permit type must be specified (e.g. 'transit', 'visitor', 'work')."
  rule_type: regex_format
  field: permit_type
  pattern: "^[A-Za-z \\-]{2,50}$"
  error_message: "Permit type field is missing or invalid."

- rule_name: permit_issuing_authority_present
  description: "Issuing authority must be present on the permit."
  rule_type: regex_format
  field: issuing_authority
  pattern: "^.{2,100}$"
  error_message: "Issuing authority field is missing or too short."
