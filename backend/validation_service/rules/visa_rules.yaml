# Visa Validation Rules

- rule_name: visa_expiry_not_passed
  description: "Visa validity must not be expired."
  rule_type: date_check
  field: entry_validity
  condition: "> today"
  error_message: "Visa validity period has lapsed."

- rule_name: visa_number_format
  description: "Visa number format check."
  rule_type: regex_format
  field: visa_number
  pattern: "^[A-Z0-9]{8,12}$"
  error_message: "Visa identifier format invalid."

- rule_name: visa_stay_duration_valid
  description: "Stay duration must be a positive integer days/months."
  rule_type: regex_format
  field: stay_duration
  pattern: "^[0-9]{1,3}(\\s*(days|months|d|m))?$"
  error_message: "Invalid stay duration format."
