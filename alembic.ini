# alembic.ini — Alembic configuration
# Run migrations with: alembic upgrade head
# Create a new migration: alembic revision --autogenerate -m "description"

[alembic]
script_location = backend/orchestrator/db/migrations
prepend_sys_path = .

# Alembic reads DATABASE_URL from the environment via env.py — not set here
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
